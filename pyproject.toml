[project]
name = "dycco"
version = "1.1.0"
description = "Literate-programming-style side-by-side documentation generator"
readme = "README.md"
authors = [
    { name = "R J Ladyman", email = "it@file-away.co.uk" }
]
requires-python = ">=3.14"
license = "MIT"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Documentation',
    'Topic :: Software Development :: Documentation',
    'Topic :: Software Development :: Libraries :: Python Modules',
]

dependencies = [
    "importlib-metadata==5.0.0",
    "markdown>=2.4",
    "pygments>=2.7.4",
    "pystache>0.5.3",
    "zipp==3.10.0",
]

[project.scripts]
dycco = "dycco.cli:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "check-manifest>=0.51",
    "pydoctor>=25.10.1",
    "pytest>=9.1.1",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dycco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.check-manifest]
ignore = ["Notneeded/*"]
